[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i2rt"
version = "0.0.1"
description = "I2RT YAM Repo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "click<8.2.0",
    "dm-env==1.6",
    "evdev==1.9.2 ; sys_platform == 'linux'",
    "mujoco==3.3.5",
    "numpy==2.2.6",
    "portal==3.7.3",
    "pygame==2.6.1",
    "python-can==4.5.0",
    "qpsolvers[quadprog]==4.7.1",
    "ruckig==0.15.3",
    "threadpoolctl==3.6.0",
    "tyro==0.9.26",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools]
# This replaces the need for find_packages() in setup.py
packages = {find = {}}

# Keep your [tool.ruff], [tool.mypy], etc., exactly as they were!

[tool.setuptools_scm]
version_scheme = "post-release"
write_to = "i2rt/_version.py"
